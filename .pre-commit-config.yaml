# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-json
      types: [file]  # override `types: [json]`
      files: \.(json|ipynb)$
    - id: check-yaml
    - id: check-added-large-files
      args: ['--maxkb=1024']
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: c883505f64b59c3c5c9375191e4ad9f98e727ccd # frozen: v1.0.2
    hooks:
    - id: sphinx-lint
      types: [rst]
  - repo: https://github.com/pycqa/isort
    rev: d5f40fa0553aa4bba71fcd73cf42933ae14d5116 # frozen: 9.0.0b5
    hooks:
    - id: isort
      additional_dependencies: ["toml"]
      entry: isort --profile=black
      name: isort (python)
  - repo: https://github.com/psf/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e # frozen: 26.5.1
    hooks:
    - id: black
  - repo: https://github.com/adamchainz/blacken-docs
    rev: fda77690955e9b63c6687d8806bafd56a526e45f # frozen: 1.20.0
    hooks:
    - id: blacken-docs
      args: [--line-length=79]
      additional_dependencies:
      - black
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
    - id: codespell
  - repo: local
    hooks:
    - id: linkcheck
      entry: sphinx-build -b linkcheck docs _build/html
      name: linkcheck
      language: system
      files: $(git diff --staged --name-only "*")
